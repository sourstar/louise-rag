# Wikidata — every item and property of the official JSON entity dump, one
# record each, its text per language by the vendored textifier
# (docs/notes/wikidata-build-plan.md; app/plugins/wikidata). Written as a
# TEMPLATE on 2026-10-19 night; FILLED 2026-10-20 from the node, by München
# (louise-python-rebuild.md §5): `create` mints a PERMANENT collection_id and
# space_id from these bytes, so every value below is one read on the node:
#
#   layers[0].chunker.params.tokenizer  sha256 of jina-v3's tokenizer.json at
#                                       ab036b0 (f59925fc…)
#   space.encoder.weights               the weights folder deploy/jina-embeddings-v3/
#                                       fetch.py writes (f0f752ae…)
#   space.encoder.engine, space.query.encoder.engine
#                                       the two stated runs on tree louise-python-20261020c
#                                       (document run bec9c3a0…, query run dd90f8d4…),
#                                       `hold embedder run --api vega --model vega-jina-v3
#                                       [--query]`, re-serialised sort_keys/compact;
#                                       the task's context_size is the space's ctx (the
#                                       text's window; the instruction rides on top)
#   work.tokens                         from the throughput measured on the B70
#                                       (2,016 tokens/s warm, one text per call)
#
# Then, on the node:
#
#   hold collection create wikidata --recipe wikidata-recipe.toml \
#       --name wikidata --platform-image <the running image's digest> \
#       --encoder http://192.168.178.10:30286 --api vega --embed-model vega-jina-v3 \
#       --query-model vega-jina-v3-query
#
# The licence is GREEN (CC0): no acknowledgement. The corpus folder is
# /corpora/wikidata; the fetch is the dated dump of the snapshot the file
# pins (`snapshot = "20261012"` in collections/wikidata.toml), 103.4 GB over
# at most two connections, verified against the run's md5sums; the first
# scan builds the pack and the label table in one streaming pass (hours;
# resumable at a chunk of 100,000 entities):
#
#   hold records fetch wikidata --profile all
#
# INVARIANT 12, MEASURED (München, 2026-10-20, approved-encoders.md "torch"):
# torch's defaults do NOT reproduce on the B70 (204/512 texts bit-identical,
# the short texts the ones that differ); with LOUISE_TORCH_DETERMINISTIC=1 in
# the model's env — carried by the stated run below — the document model is
# 512/512 bit-identical over 2 fresh loads × 2 shuffled passes (2,048
# vectors, 974 s). The query model's measurement: see approved-encoders.md
# before `create` (it must read 512/512 too).

[descriptive]
title = "Wikidata — items and properties, as text"
summary = "Every item and property of Wikidata's JSON entity dump as one record: its labels, descriptions, aliases, statements with qualifiers, and sitelinks kept whole; a text rendering per language for search, built from the dump alone. CC0."

# D3: one layer, the language list a parameter; a language added is a
# daughter collection (02 §2.7). The chunker is Wikimedia's cut over the
# textifier's statements at 1,024 tokens of jina-v3's tokenizer (06 §6.3).
[[layers]]
rule = "default"
[layers.chunker]
id = "wikidata-text"
version = 1
[layers.chunker.params]
max_tokens = 1024
tokenizer = "sha256:f59925fcb90c92b894cb93e51bb9b4a6105c5c249fe54ce1c704420ac39b81af"  # tokenizer.json of jinaai/jina-embeddings-v3 at ab036b0 (München, 2026-10-20)

[space]
# jina-embeddings-v3, the Matryoshka cut Wikimedia used (dim 512), f16,
# mean pooling, normalised; `cut: tokens` at the chunker's window
dim = 512
dtype = "f16"
ctx = 1024
pooling = "mean"
normalise = true
cut = "tokens"
tolerance = "0.95"
epoch = "0"
evaluation = ""

[space.encoder]
weights = "sha256:f0f752aea9e660f8120e2cb7ae32377794c45e53bfbeee3f1f6ecf36d7c0c572"  # the folder deploy/jina-embeddings-v3/fetch.py writes: ab036b0 + remote code bd55a5ec…, measured on the node 2026-10-20
label = "jinaai/jina-embeddings-v3 (ab036b0; adapter retrieval.passage; LocalAI's louise-python jina-v3 task, torch XPU, behind VeGa; the node's card)"

# an asymmetric space: the same weights with the retrieval.query adapter for questions
[space.query]
instruction = ""
[space.query.encoder]
weights = "sha256:f0f752aea9e660f8120e2cb7ae32377794c45e53bfbeee3f1f6ecf36d7c0c572"  # the same folder, the retrieval.query adapter is the engine's option
label = "jinaai/jina-embeddings-v3 (ab036b0; adapter retrieval.query)"

# The calibration set (09 §9.12): the platform's 512 texts, /srv/calibration/text.jsonl,
# the same set both invariant-12 measurements of 2026-10-20 embedded 512/512;
# the quorum as every other collection's (normattiva-recipe.toml). Added
# 2026-10-20 after `create` refused the recipe without it (München, 09:55Z).
[space.calibration]
set = "sha256:7d06a2f6a4a773da01a517cb30571cac421753df3e30b20fca4716e5441fbf0f"

[space.calibration.quorum]
n = 16
min_pass = 12

# The stated run of the DOCUMENT side, byte for byte (09 §9.3): LocalAI's
# louise-python backend, tree -20261020c (deploy/localai/backends/louise-python,
# the jina-v3 task of deploy/jina-embeddings-v3/server.py), behind VeGa.
# `create` holds the endpoint's stated run to these values, or creates nothing.
[space.encoder.engine]
name = "localai/louise-python-20261020c"
build = "1807f28089ff"
image = "sha256:1807f28089ff51d8c2806efd77e1aef204b57be4faed0ff14dff965835c7cca4"
args = ["${BACKEND}/run.sh", "--addr", "127.0.0.1:${PORT}"]
device = "Intel(R) Arc(TM) Pro B70 Graphics"

[space.encoder.engine.env]
# invariant 12: torch's deterministic algorithms, switched on by the task
# (measured: 204/512 without, 512/512 with — approved-encoders.md)
LOUISE_TORCH_DETERMINISTIC = "1"
NEO_CACHE_DIR = "/data/louise-cache/neo-cache"

[space.encoder.engine.options]
ContextSize = 1024
Embeddings = true
FlashAttention = "auto"
MMap = true
Model = "weights/jina-embeddings-v3"
ModelFile = "${WEIGHTS}"
ModelPath = "${MODELS}"
NBatch = 1
Options = ["task:jina-v3", "device:xpu", "adapter:retrieval.passage", "dim:512"]
Threads = 6

# The QUERY side: the same tree and weights, the retrieval.query adapter —
# another engine (the adapter is a load option), the same space.
[space.query.encoder.engine]
name = "localai/louise-python-20261020c"
build = "1807f28089ff"
image = "sha256:1807f28089ff51d8c2806efd77e1aef204b57be4faed0ff14dff965835c7cca4"
args = ["${BACKEND}/run.sh", "--addr", "127.0.0.1:${PORT}"]
device = "Intel(R) Arc(TM) Pro B70 Graphics"

[space.query.encoder.engine.env]
LOUISE_TORCH_DETERMINISTIC = "1"
NEO_CACHE_DIR = "/data/louise-cache/neo-cache"

[space.query.encoder.engine.options]
ContextSize = 1024
Embeddings = true
FlashAttention = "auto"
MMap = true
Model = "weights/jina-embeddings-v3"
ModelFile = "${WEIGHTS}"
ModelPath = "${MODELS}"
NBatch = 1
Options = ["task:jina-v3", "device:xpu", "adapter:retrieval.query", "dim:512"]
Threads = 6

[work]
# The ONGOING work per month that keeps the collection active (04 §4.7),
# in tokens of jina-v3's tokenizer. MEASURED THROUGHPUT, the node's B70,
# 2026-10-20 (München): 512 calibration texts in 110.28 s warm, one text per
# call through VeGa at window 1,024 — 222,345 tokens per pass = 2,016
# tokens/s (median 0.104 s/call, p95 0.183 s). The plan's formula (tokens
# per month from the measured throughput) at the ACTIVE COUNT the operator
# set, two hours a day (2026-10-20; eight hours was proposed and changed
# before the create), for thirty days: 2,016 × 3,600 × 2 × 30 = 435 M;
# written as 430 M. A holder that embeds or checks this much a month keeps
# the collection active; less, and it shows dormant — true information (04
# §4.7). Once the embedding is done, a monthly check over parts whose listed
# tokens total this much keeps it active (04 §4.7: attestations count).
# Inside collection_id: fixed for the collection's life.
tokens = 430000000
per = "P1M"

[validation]
sample = 512
checks = ["roots", "chunks", "calibration", "records-vs-origin"]
