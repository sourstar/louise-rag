# The node's quiet / day / night profiles, as they sit in platform.toml
# (desired state, Tier 2; app/node_profile.py, docs/notes/node-profiles-design.md).
# The operator's schedule of 2026-10-26; decisions of 2026-10-27.

[schedule]
# Which profile is active, by local wall-clock time. The SAME grammar as
# [bandwidth] schedule (app/transfer/schedule.py): clauses separated by ";",
# the first match wins, a window may wrap midnight, "else" covers the rest.
profile = "06:00-08:00 quiet; 08:00-12:00 day; 12:00-13:30 quiet; 13:30-16:30 day; 16:30-22:30 quiet; else night"
# Optional, per weekday (mon..sun); a day without a line uses `profile` above.
# sat = "08:00-22:30 quiet; else night"

[profiles.quiet]
cpu_cores = 12      # the operator, 2026-11-02: "Use 12 CPU cores even in the quiet hours" (a quieter
                    # CPU cooler). 0 would pause background CPU work at the end of its unit
gpu = "quiet"       # the card power-limited, still used: embedding goes on (operator, decision 3)

[profiles.day]
cpu_cores = 12      # as quiet and night since 2026-11-02 (it was 8)
gpu = "full"

[profiles.night]
cpu_cores = 12
gpu = "full"

[gpu.levels.full]
power_limit = "max"           # the card's own limit, as the governor reads it at start.
# A card with no power1_rated_max (the node's B70 on 6.18: power1_cap only)
# cannot tell its own limit from a quiet one a governor left behind, so a
# restart in a quiet window would read 110 W as "max". There, give watts:
# power_limit = "230W"

[gpu.levels.quiet]
power_limit = "50%"           # of the card's maximum, until the fan measurement gives watts ("120W")
max_clock = "50%"             # used only where the driver offers no writable power limit
fan_max_rpm = 1200            # applied only if the driver lets software set the fan

# Collections say WHAT to embed in their own file, in every profile:
#   collections/gutenberg.toml     embed = "all"     (or "p2p", "on-demand", "off")
#   louise hold config apply gutenberg --set embed=all
# Queries are never limited by a profile; `louise node pause` wins over it.
