# BGE-M3 encoder — TrueNAS SCALE custom app (Install via YAML; suggested
# app name "bge-m3-embed")
#
# Serves BAAI/bge-m3 (1024-dim, MIT license, ~570M params, 8192-token
# context) via HuggingFace text-embeddings-inference on CPU. This is the
# space of the large published Wikipedia embedding sets (Upstash 2024-06,
# 11 languages; Stanford OVAL 2024-08, 10 languages), so pinning wikipedia
# to it keeps genesis-style vector reuse possible. Unlike MedCPT there is
# no bi-encoder pair: ONE encoder serves both documents and queries.
#
#   encoder (documents + queries) -> :30442   BAAI/bge-m3
#
# Serves OpenAI-compatible /v1/embeddings; BGE pools on [CLS], hence
# --pooling cls. Weights (~2.3 GB) download from the HF Hub on first start
# into the mapped cache (create the dataset first:
# /mnt/ssd4/apps/bge-m3-models).
#
# GPU NOTE: TEI also publishes an Intel-optimized container path with XPU
# (Intel Arc) builds — see docs/source/en/intel_container.md in the TEI
# repo. Because the space pin covers the MODEL (weights hash, dim, pooling,
# normalization) and not the serving backend, the CPU container can later
# be swapped for an XPU build behind the same URL without re-embedding —
# the behavioral backend gate re-verifies the endpoint still computes the
# same function before any embed runs. CPU first: it is the proven path
# (MedCPT precedent) and never competes with llama-server for the GPU.
#
# AFTER INSTALL — wiring the wikipedia collection into the BGE-M3 space:
#
#   1. The wikipedia collection must hold ZERO vectors (it does at the time
#      of writing: the corpus had not even downloaded). Reset its space pin
#      (records Qwen3 from before the [embed] block existed):
#          docker exec ix-louise-rag-worker-1 python /tmp/wiki_pin_reset.py
#      The reset script refuses to run if any vector table exists.
#
#   2. Ensure /mnt/ssd4/apps/louise-rag/config/collections/wikipedia.toml
#      carries the [embed] block:
#          [embed]
#          url = "http://192.168.178.10:30442"
#          api = "openai"
#          model = "BAAI/bge-m3"
#          dtype = "f16"
#          ctx = 8192
#          dim = 1024
#          concurrency = 4
#      (no query_url: bge-m3 embeds queries and documents with the same
#      model; concurrency 4 = CPU multi-document embed path)
#
#   3. Nothing else: the worker hot-reloads the TOML within one round. The
#      first boot validation after that pins the bge-m3 space (weak hash
#      upgrade happens automatically once the endpoint is reachable).
#      Embedding stays OFF until a genesis archive for wikipedia is
#      registered or the operator flips the Library card selector.

services:
  bge-m3:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    command: --model-id BAAI/bge-m3 --pooling cls --port 8080
    restart: unless-stopped
    ports:
      - '30442:8080'
    volumes:
      - /mnt/ssd4/apps/bge-m3-models:/data
