# CPU TWIN of vega-qwen3-embedding-4b (gutenberg's encoder), for the
# cross-vendor deviation reference (docs/notes/approved-encoders.md): the same
# build and options with no card at all — no layers, no op offload, and CUDA
# shown no device (a CUDA context alone moves a few hundred MiB, which a CPU
# run must not; vega_wrapper.device_on_nvidia). ~13 s a text on 6 threads: a
# measurement bounds it (tools/cross_vendor_check.py --twin-limit-s).
name: vega-qwen3-embedding-4b-cpu
backend: vega-llama-cpp
embeddings: true
pinned: false
context_size: 8192
threads: 8
gpu_layers: 0
flash_attention: "on"
mmap: true
parameters:
    model: weights/llama-embed/Qwen3-Embedding-4B-Q4_K_M.gguf
    batch: 8192
    seed: 0
options:
    - parallel:1
    - pooling:last
    - ubatch:8192
    - no_op_offload:true
env:
    CUDA_VISIBLE_DEVICES: "-1"
