# RAGE over LocalAI — TrueNAS SCALE custom app "louise-rage", migration step 15
# (docs/notes/rage-over-localai.md). REPLACES deploy/truenas-rage.yaml at 15f's
# cut-over; NOT YET DEPLOYED. The same app, the same folder, the same port: the
# image changes, and with it who launches the models (LocalAI) and what RAGE
# does (the run of every answer, the clock, the door to LocalAI, the panel).
#
# THE IMAGE, by digest: deploy/rage/Dockerfile.localai, published like the
# llama-swap one (deploy/truenas-rage.yaml's header says where and how), and
# the same digest in RAGE_IMAGE. A tag refuses to start (09 §9.12).
#
# THE MODELS' YAML IS LocalAI'S, under RAGE's state, WRITABLE:
#   /mnt/ssd5/apps/louise-rage/state/localai-models/    (LOCALAI_MODELS_DIR)
# PUT and DELETE /louise/models/<id> write and remove the files RAGE wrote;
# the operator's own are copied in once, by hand (step 1 below).
# THE WEIGHTS ARE MOUNTED READ-ONLY INSIDE IT, at weights/<what>, where they
# already are (invariant 5: nothing here fetches or writes a model). LocalAI
# loads only from inside its models directory (`VerifyPath`), so the weights
# cannot live beside it. A model YAML names its file `weights/<what>/<file>`.
#
# THE CUT-OVER (15f), as deploy/truenas-rage.yaml's, with the steps that change:
#   0. Record today's vectors from each endpoint first (rage.md §14).
#   1. mkdir -p /mnt/ssd5/apps/louise-rage/state/localai-models
#      cp deploy/rage/localai-models/*.yaml /mnt/ssd5/apps/louise-rage/state/localai-models/
#      config/rage.toml becomes the cards alone (app/rage/localai_config.py):
#        [rage]
#        device_names = { xpu = "Intel(R) Arc(TM) Pro B70 Graphics" }
#        pci          = { xpu = "0000:03:00.0" }
#   2. `node pause` on Louise.
#   3. Edit this app: the image below, by digest, and the volumes below.
#   4. `GET http://<nas>:30437/louise/models`: LocalAI's models; a request
#      loads one, and `/louise/gpu`'s events show its run.
#   5. The URLs in Louise's collection files stay as they are
#      (.../upstream/<model>): the URL names the model, and the front gives
#      LocalAI that model whatever the body says.
#   6. Every space is re-gated by itself (a new engine, 03 §3.3), then
#      `node resume`.
#   BACK OUT: the previous image by its digest, and deploy/truenas-rage.yaml's
#   volumes. Nothing of the llama-swap folder layout is removed by this one.

services:
  rage:
    image: <registry>/rage@sha256:<digest>
    restart: unless-stopped
    init: true                              # forwards the stop signal, reaps LocalAI and its backends
    devices:
      - /dev/dri
    cap_add:
      - PERFMON                             # the card's real memory (rage.md §19), as before
    mem_limit: 28g                          # as deploy/truenas-rage.yaml, for the same reasons
    environment:
      RAGE_IMAGE: 'sha256:<digest>'
      RAGE_FREQ_DIR: /gpufreq
      ADMIN_TOKEN_FILE: /run/rage/admin.token   # a path, never the token (invariant 8)
      # RAGE_RUNNER=localai, LOCALAI_MODELS_DIR and the backends' paths are the
      # image's (deploy/rage/Dockerfile.localai). No LocalAI key: it listens on
      # loopback and RAGE is the door (rage-over-localai §8.4).
    healthcheck:
      test:
        - CMD
        - /opt/venv-front/bin/python
        - '-c'
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    ports:
      - '30437:8080'
    stop_grace_period: 60s
    volumes:
      - /mnt/ssd5/apps/louise-rage/config:/config
      - /mnt/ssd5/apps/louise-rage/state:/state
      # the weights, inside LocalAI's models directory, READ-ONLY
      - /mnt/ssd5/apps/bge-m3-models:/state/localai-models/weights/bge-m3:ro
      - /mnt/ssd5/apps/medcpt-models:/state/localai-models/weights/medcpt:ro
      - /mnt/ssd5/apps/madlad-models:/state/localai-models/weights/madlad:ro
      - /mnt/ssd5/apps/llama-embed:/state/localai-models/weights/llama-embed:ro
      - /mnt/ssd5/apps/louise-rage/models/chat:/state/localai-models/weights/chat:ro
      # the clock: the colon-free symlink of deploy/truenas-rage.yaml
      - /mnt/ssd5/apps/louise-rage/gpufreq:/gpufreq
      - /mnt/ssd5/apps/louise-rage/secrets/admin.token:/run/rage/admin.token:ro
