# DNABERT-2 encoder — TrueNAS SCALE custom app (Install via YAML; suggested
# app name "dnabert2-embed")
#
# The genome collection's dense-by-sequence leg (§9): paste a read or motif,
# find where it places. DNABERT-2 (117M params, Apache-2.0-licensed weights,
# BPE + ALiBi) is the CPU-viable open DNA encoder the doc's hardware table
# names; Evo-class models stay CUDA-only. TEI cannot serve it
# (trust_remote_code), so this is a ~100-line FastAPI server speaking the
# same surface: /v1/embeddings, /health, and TEI's /info shape so the space
# pin CONFIRMS the served weights instead of staying weak.
#
#   encoder (documents + queries) -> :30443   zhihan1996/DNABERT-2-117M
#
# BEFORE INSTALL — the image is built locally, not pulled:
#   1. cd /mnt/ssd4/apps/louise-rag/src && docker build -t dnabert2-embed:local deploy/dnabert2
#   2. Create the weights-cache dataset: /mnt/ssd4/apps/dnabert2-models
#      (~450 MB downloads on first start)
#
# AFTER INSTALL — wiring the genome collection into the DNA space:
#
#   1. The genome collection must hold ZERO vectors (it does: embed mode has
#      been off since creation). Reset its space pin (records the node
#      default from before this encoder existed):
#          docker exec ix-louise-rag-worker-1 python /tmp/genome_pin_reset.py
#      (same refuse-if-vectors-exist script pattern as wikipedia's switch)
#
#   2. Add to /mnt/ssd4/apps/louise-rag/config/collections/genome.toml:
#          [embed]
#          url = "http://192.168.178.10:30443"
#          api = "openai"
#          model = "zhihan1996/DNABERT-2-117M"
#          dtype = "f16"
#          ctx = 1024
#          dim = 768
#          concurrency = 2
#      ctx=1024 is load-bearing: genome chunks are CHUNK_TOKENS*4 = 4000
#      bases, and the client's char budget is ctx*4 — a smaller ctx would
#      silently truncate every window and corrupt the coordinate mapping.
#      concurrency 2 = the CPU multi-document embed path (GPU stays serial).
#
#   3. Hot-reload applies the recipe; flip the genome card's embed mode to
#      "all" when ready. Yeast (~3.2k windows) embeds in minutes; the gate
#      baselines the endpoint on first use like every other backend.

services:
  dnabert2:
    image: dnabert2-embed:local
    restart: unless-stopped
    ports:
      - '30443:8080'
    environment:
      - TORCH_THREADS=4
    volumes:
      - /mnt/ssd4/apps/dnabert2-models:/data
