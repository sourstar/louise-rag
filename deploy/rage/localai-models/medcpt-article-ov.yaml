# medcpt-article-ov — LocalAI's model YAML, the operator's (docs/notes/input-forms.md;
# rage-over-localai.md §7, §10, §13). Copied once into LocalAI's models directory;
# no first-line marker, so RAGE's API never rewrites it (409): edit it by hand.
# THE BACKEND is deploy/localai/backends/louise-medcpt-article-ov: MedCPT's article
# encoder on OpenVINO, `Embedding` of a TEXT PAIR (title, abstract) as NCBI encoded
# its archive. `pairs:true` lets RAGE's front accept `input_pairs` for it; being an
# option, it is in the load call and so in the run's engine options and run_id.
# THE WEIGHTS are the OpenVINO IR deploy/medcpt-rerank/convert_article.py writes
# from ncbi/MedCPT-Article-Encoder, beside the cross-encoder's IR.
# READ by the backend: context_size (tokens per pair, NCBI's max_length 512), the
# device and pairs options, OV_CACHE_DIR. PINNED and not read: threads,
# gpu_layers, parameters.batch (one text per call) and seed — so that LocalAI
# fills in nothing (§10).
{
  "name": "medcpt-article-ov",
  "backend": "louise-medcpt-article-ov",
  "embeddings": true,
  "context_size": 512,
  "threads": 6,
  "gpu_layers": 0,
  "parameters": {
    "model": "weights/medcpt/medcpt-article-ov",
    "batch": 1,
    "seed": 0
  },
  "options": [
    "device:xpu",
    "pairs:true"
  ],
  "env": {
    "NEO_CACHE_DIR": "/state/neo-cache",
    "OV_CACHE_DIR": "/state/ov-cache"
  }
}
