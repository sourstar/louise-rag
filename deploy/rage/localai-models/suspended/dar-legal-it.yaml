# dar-legal-it — LocalAI's model YAML, the operator's (migration step 15e-2;
# docs/notes/rage-over-localai.md §7, §10). Copied once into LocalAI's models
# directory at the cut-over, as the six llama.cpp ones; no first-line marker,
# so RAGE's API never rewrites it (409): edit it by hand.
# THE BACKEND is deploy/localai/backends/louise-dar-legal-it: `Embedding`,
# MEAN pooling, one text per call. The query prefix is NOT here: Louise
# prepends the Codex's `space.query.instruction` itself, so the server's
# QUERY_PREFIX and ATTN_BUDGET (one text per call: no batch to budget) are gone.
# READ by the backend: context_size (the longest text in tokens, the server's
# MAX_SEQ) and the device option. PINNED and not read: threads, gpu_layers,
# parameters.batch and seed — so that LocalAI fills in nothing (§10).
{
  "name": "dar-legal-it",
  "backend": "louise-dar-legal-it",
  "embeddings": true,
  "context_size": 8192,
  "threads": 6,
  "gpu_layers": 0,
  "parameters": {
    "model": "weights/dar-legal-it",
    "batch": 1,
    "seed": 0
  },
  "options": [
    "device:xpu"
  ],
  "env": {
    "NEO_CACHE_DIR": "/state/neo-cache"
  }
}
