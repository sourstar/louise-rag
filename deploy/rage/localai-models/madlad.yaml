# madlad — LocalAI's model YAML, the operator's (migration step 15e-2;
# docs/notes/rage-over-localai.md §7, §10). Copied once into LocalAI's models
# directory at the cut-over, as the six llama.cpp ones; no first-line marker,
# so RAGE's API never rewrites it (409): edit it by hand.
# THE BACKEND is deploy/localai/backends/louise-madlad: `Predict`, the batch as
# one JSON prompt, read by app/translate.py with TRANSLATE_API=completion. So
# NO template, and none of echo, cutstrings, extract_regex, trimspace or
# trimsuffix: the completion's text must be the backend's JSON, untouched.
# READ by the backend: parameters.batch (segments per pass, the server's BATCH)
# and the options. PINNED and not read: context_size, threads, gpu_layers and
# seed (greedy decoding) — every field LocalAI would otherwise fill in (§10),
# so that only an edit here changes the run.
# From deploy/rage/rage.example.toml's entry: BATCH 32, MAX_SEG_TOKENS 96, and
# the server's defaults (bfloat16, one beam, 512 items). LD_LIBRARY_PATH is
# the backend's run.sh now, inside the image.
{
  "name": "madlad",
  "backend": "louise-madlad",
  "context_size": 512,
  "threads": 6,
  "gpu_layers": 0,
  "parameters": {
    "model": "weights/madlad/madlad400-3b-mt-bf16",
    "batch": 32,
    "seed": 0
  },
  "options": [
    "device:xpu",
    "dtype:bfloat16",
    "max_seg_tokens:96",
    "beams:1",
    "max_items:512"
  ],
  "env": {
    "NEO_CACHE_DIR": "/state/neo-cache"
  }
}
