# rage.toml — the cards RAGE states runs on (app/rage/localai_config.py).
#
# Copy to /mnt/ssd5/apps/louise-rage/config/rage.toml. Since migration step 15
# the models are LocalAI's YAML (deploy/rage/localai-models/), and this file
# declares the cards and nothing else: a [models] table, or any lifecycle key
# (memory, priority, preload, park, cmd), is refused at start. Until 15g it
# held llama-swap's whole desired state (docs/notes/legacy-to-delete.md §8).

[rage]
# Each card as its driver names it: what every run identity and every Codex
# created here calls the device (09 §9.3).
device_names = { xpu = "Intel(R) Arc(TM) Pro B70 Graphics" }
# The card's PCI address (`lspci -D`). Two jobs: the kernel driver a run states
# is the one THIS card is bound to, and a model is on the card whose address
# its process's DRM clients report (`drm-pdev`) — read, never declared. RAGE
# names no manufacturer: `xe` here, `amdgpu` or `nvidia` elsewhere. This node
# loads two GPU drivers (the Arc's and the processor's own graphics), and
# without this line no run would be stated.
pci          = { xpu = "0000:03:00.0" }
