# louise-rag — TrueNAS SCALE custom app (Install via YAML)
#
# Successor to the legacy gutenberg-rag app: same two-container shape
# (web + worker), same corpus/data mounts, plus the platform's additions —
# a config mount (collections/*.toml, platform.toml, space artifacts), the
# node key read-only (its private half in the worker only), admin auth for the librarian pages, and the bundle
# machinery.
#
# DATA LAYOUT. The platform runs on its own dataset, /mnt/ssd4/apps/louise-rag
# (NVMe gen4, 2 TB): data/ holds the manifest + fts + lancedb COPIED from the
# legacy app on 2026-08-17, config/ holds the TOML config, secrets/ the node
# key. The original at /mnt/ssd5/apps/gutenberg-rag is NEVER mounted or written by
# this app — it stays pristine as the offline fallback, together with the
# stopped gutenberg-rag app. Every step below operates on the copy only.
#
# BEFORE FIRST START — two one-time steps, in order (NAS shell):
#
#   1. Build the image (from a checkout of this repo on the NAS):
#        docker build -t louise-rag:local .
#
#   2. Create the node key and its public half (see NODE KEY below):
#        S=/mnt/ssd4/apps/louise-rag/secrets
#        mkdir -p -m 700 $S/private; mkdir -p -m 755 $S/public
#        docker run --rm -v $S:/secrets \
#          -e NODE_KEY_PATH=/secrets/private/node.key \
#          -e NODE_PUBLIC_KEY_PATH=/secrets/public/node.pub \
#          louise-rag:local python -m app.louise hold key create
#        chmod 400 $S/private/node.key
#
#   (A third step, migrating the manifest copied in 2026-08 and resetting
#   its 714 corrupted books, ran once on 2026-08-17; the pre-Codex manifest
#   it migrated is gone, and `louise dev migrate schema` applies any schema
#   change a state database still lacks.)
#
# VECTOR FORENSICS (verified live against the production NAS, 2026-08-16/17).
# The stored v2 vectors are CORRECT for 9,847 of the 10,561 embedded books:
# re-embedding their text on the current llama-embed reproduces them at
# cos >= 0.9999. The first 714 books (embedded 2026-07-20 20:12 ->
# 2026-07-21 12:53 UTC, before a 12:58 restart) are degenerate — an entire
# book collapses into one cone (pairwise cos ~0.97) — and must be redone
# (reset once, 2026-08-17). Root cause, reproduced on demand: llama-server corrupts long
# sequences when a single /v1/embeddings request carries MULTIPLE texts
# (batch of 8 -> cos 0.32 vs the same text alone; deterministic per batch
# shape), and its prompt cache can then replay the corrupted result even for
# a later single-text request. Hence EMBED_BATCH=1 below is LOAD-BEARING —
# never raise it while the backend is llama-server. Concurrent single-text
# requests are verified safe (cos >= 0.9999), so EMBED_CONCURRENCY=2 keeps
# the -np 4 server busy. EMBED_VERSION stays 2: the surviving vectors are
# valid for the exact model the queries will use.
#
# Pin the llama-embed app's image by digest (or its per-build tag, e.g.
# server-intel-b10450) — the moving :server-intel tag is what turned this
# into a forensic exercise: the image changed multiple times mid-run and
# nothing could tell. The platform's space pinning + verify-on-use exists
# for exactly this, but only helps once vectors are made under it.
#
# NODE KEY — kept out of reach of whatever can write state/ (docs/notes/
# rage.md §13, "layer 2"). A validation counts only when this node's key
# signed it, so a planted statement is harmless only while the key cannot be
# read by what planted it. So the key lives in its own dataset, secrets/ —
# never under data/ (where state/ lives), never in a folder shared over
# SMB/NFS or replicated to another host — in two folders:
#   secrets/private/node.key  mode 0400, root (the containers' user); the
#                             WORKER only. It signs: validations, a new
#                             collection, bundles.
#   secrets/public/node.pub   mode 0444; web and worker. The web only
#                             RECOGNISES what this node signed, so it never
#                             holds the seed (app/identity.py); the Library's
#                             create and export are queued for the worker
#                             (app/jobs.py).
# Both read-only; never gpu-probe. node.pub is not secret but is TRUSTED —
# whoever replaces it decides which signatures the web calls this node's —
# so it is kept beside the key, never in config/. The worker refuses to start
# when node.pub is not node.key's half; the node refuses a key readable by
# group or others, and a public file writable by them. FOLDERS are mounted,
# not files: a file mount whose source is missing makes Docker create a
# directory in its place, and a later `mv` would land inside it.
# The limit: code running inside the worker can read the key; this guards
# against file-level writes to state/ — a copied or restored state/, a share,
# another container on the dataset — and against a compromised web process.
#
# MOVING AN EXISTING KEY here (the key made before 2026-09-29 sits in
# config/). MOVE it, never regenerate it: a new key is a new identity —
# peers stop recognising this node's bundles and packs, and every validation
# it signed is ignored, so every encoder is gated again. In this order:
#   1. build the image (step 1 above), stop the app;
#   2. S=/mnt/ssd4/apps/louise-rag/secrets
#      mkdir -p -m 700 $S/private; mkdir -p -m 755 $S/public
#      mv /mnt/ssd4/apps/louise-rag/config/node.key $S/private/
#      chown root:root $S/private/node.key; chmod 400 $S/private/node.key
#      docker run --rm -v $S:/secrets -e NODE_KEY_PATH=/secrets/private/node.key \
#        louise-rag:local python -m app.louise hold key show
#      and write its `key` value, one line, to $S/public/node.pub (chmod 444);
#   3. install this YAML (its mounts name secrets/), then start the app.
# Keep a copy of node.key offline: losing it is the same as regenerating it.
# Signing from the command line runs in the worker container
# (`docker exec <worker> python -m app.louise …`): the web holds no key.
#
# Put the admin token in a file before installing (secrets/admin-token,
# one line) — ADMIN_TOKEN_FILE names it: a secret is referenced by path,
# never given as a value (CLAUDE.md invariant 8). It gates the
# Library/Network/System pages and the mutating API. No file = those areas
# are locked out entirely (fail-closed), while Ask stays LAN-open until the
# first `louise user add`.
#
# The external TrueNAS rsync task feeding /corpus stays exactly as it is —
# the worker rescans at startup and every DISCOVER_INTERVAL_MIN minutes.
#
# ADDING A COLLECTION WITH ITS OWN CORPUS: corpus datasets are mapped under
# ONE well-known root, /corpora (env CORPUS_MOUNTS_DIR). Create the dataset,
# then add a volume to BOTH services below, e.g.
#     - /mnt/tank/data/pubmed:/corpora/pubmed        # rw: platform acquires into it
#     - /mnt/<pool>/<dataset>:/corpora/<name>:ro     # ro: external process feeds it
# After the app restarts with the mount, the folder appears in the Library
# page's corpus dropdown (folders in use by a collection are not selectable).
# Collections themselves hot-reload — only the mount needs this app edit.

services:
  web:
    image: louise-rag:local
    pull_policy: never
    restart: unless-stopped
    # init: without it the app's Python is the container's PID 1, and PID 1
    # must reap orphans. rsync forks a receiver; when rsync exits first (a
    # SIGKILL, some error exits) the receiver is re-parented to PID 1 and
    # stays a zombie forever — observed live 2026-09-13, 25 in 3 h. Docker's
    # init reaps them. The worker warns at start when it finds itself PID 1.
    init: true
    ports:
      - '30042:8742'
    environment: &env
      # ── paths ──
      DATA_DIR: /data
      CORPUS_DIR: /corpus
      CONFIG_DIR: /config
      # the web recognises this node's signatures and makes none: the
      # public half only (NODE_KEY_PATH is the worker's) — see NODE KEY
      NODE_PUBLIC_KEY_PATH: /run/louise/public/node.pub
      # ── model endpoints (unchanged from the legacy app) ──
      CHAT_URL: http://192.168.178.10:30068
      CHAT_MODEL: qwen3:8b
      TRANSLATE_URL: http://192.168.178.10:30448
      # the System page's GPU panel — the gpu-probe service below, by name
      GPU_PROBE_URL: http://gpu-probe:8080
      # no EMBED_URL: a collection names its own encoder in its file's
      # [encoder], and one that names none is refused (2026-09-18)
      # EMBED_BATCH=1 is LOAD-BEARING: llama-server corrupts long sequences
      # in multi-text embedding requests (see header). Every encoder runs
      # one stream (-np 1, invariant 12); a second request in flight waits
      # at the server.
      EMBED_BATCH: '1'
      EMBED_CONCURRENCY: '2'
      RERANK_URL: ''
      # ── pipeline versions ──
      CHUNK_TOKENS: '1000'
      CHUNK_OVERLAP: '120'
      CHUNK_VERSION: '1'
      FTS_VERSION: '1'
      EMBED_VERSION: '2'          # stored v2 vectors verified correct (header); only the 714 reset on 2026-08-17 re-embedded
      DISCOVER_INTERVAL_MIN: '360'
      # ── platform ──
      ADMIN_TOKEN_FILE: /run/louise/admin/admin-token
    volumes:
      - /mnt/tank/media/public/books/project_gutenberg:/corpus:ro
      - /mnt/ssd4/apps/louise-rag/data:/data
      - /mnt/ssd4/apps/louise-rag/config:/config
      - /mnt/ssd4/apps/louise-rag/secrets/public:/run/louise/public:ro
      - /mnt/ssd4/apps/louise-rag/secrets/admin:/run/louise/admin:ro
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8742/healthz']
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    image: louise-rag:local
    pull_policy: never
    restart: unless-stopped
    command: ['python', '-m', 'app.worker']
    init: true                  # reaps rsync's orphaned children — see web
    environment:
      <<: *env
      # the worker signs (validations, the Library's create and export,
      # app/jobs.py), so it alone holds the private key
      NODE_KEY_PATH: /run/louise/private/node.key
    volumes:
      - /mnt/tank/media/public/books/project_gutenberg:/corpus:ro
      - /mnt/ssd4/apps/louise-rag/data:/data
      - /mnt/ssd4/apps/louise-rag/config:/config
      - /mnt/ssd4/apps/louise-rag/secrets:/run/louise:ro
    stop_grace_period: 120s

  # THE GPU PROBE (app/gpu_probe.py): each card's memory and every process's
  # share, for the System page's GPU panel. The ONE container that sees the
  # host's processes (pid: host) — which also lets it read every other
  # container's files and environment through /proc — so it gets nothing
  # else: no volumes, no environment (never *env, which carries
  # ADMIN_TOKEN), no port. The web reaches it by service name.
  # PERFMON: the xe driver reports the card's used memory only to it;
  # without it the panel shows the processes' sum instead. No init: with the
  # host's PID namespace it is not PID 1, and it starts no children.
  gpu-probe:
    image: louise-rag:local
    pull_policy: never
    restart: unless-stopped
    command: ['python', '-m', 'app.gpu_probe', '--port', '8080']
    pid: host
    devices:
      - /dev/dri
    cap_add:
      - PERFMON
    read_only: true
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
