# vega-jina-v3-gguf — jina-embeddings-v3 on llama.cpp, the passage side, for the wikidata encoder
# comparison (operator, 2026-10-31: "Use jina gguf for the comparison so we can evaluate both
# speed and reliability"; docs/notes/wikidata-family-slices.md §10). The weights: our own f16
# conversion of jinaai/jina-embeddings-v3 at ab036b0 with this tree's convert_hf_to_gguf.py
# (arch jina-bert-v3, c0fd786), its retrieval.passage LoRA MERGED in by llama-export-lora — VeGa
# states no run that loads a second file (app/vega/loadopts.py SECOND_FILE_FIELDS). llama.cpp
# does not apply the adapter's prompt prefix: the caller puts the task instruction first
# (tools/measure/wikidata_encoder_ab.py JINA_INSTRUCTIONS), and cuts the vector to 512.
# Mean pooling (jina-v3's). context_size 2,048: a 1,024-token chunk, the instruction and the
# specials. Intel's two determinism switches (invariant 12); flash attention ON to be measured
# bit-exact over fresh loads before any write. NOT pinned: a measurement. JSON, which is YAML.
{
  "name": "vega-jina-v3-gguf",
  "backend": "vega-llama-cpp",
  "embeddings": true,
  "pinned": false,
  "context_size": 2048,
  "threads": 6,
  "gpu_layers": 999,
  "flash_attention": "on",
  "mmap": true,
  "parameters": {
    "model": "weights/jina-embeddings-v3-gguf/jina-v3-passage-f16.gguf",
    "batch": 2048,
    "seed": 0
  },
  "options": [
    "parallel:1",
    "pooling:mean",
    "ubatch:2048"
  ],
  "env": {
    "NEO_CACHE_DIR": "/data/louise-cache/neo-cache",
    "GGML_SYCL_ENABLE_DNN": "0",
    "GGML_SYCL_FA_ONEDNN": "0"
  }
}
