# A chat model candidate under 4 B (operator, 2026-11-03: "Search around for
# official chat models at about 4b and 2b"; docs/notes/nemotron-embed.md).
# Granite 4.2 3B (IBM, IBM's own GGUF): 3.7 B, Apache-2.0, 12 tested
# languages incl. the five, tools; thinking by default. Its card: MMLU-ProX
# lite 27.8 against 61.1 for the 8B, so the five decide.
# INSTALLED FROM LOCALAI'S MODEL GALLERY, entry `granite-4.2-3b-q8`: POST /models/apply
#   with ../gallery/louise-chat-granite-4.2-3b-q8.json.
# Ours on top: our llama.cpp package and the measured SYCL set
# (tests/vega/test_engine_settings.py), parallel 1, a 16k context, seed 0,
# no drafter, NO VISION PROJECTOR (Ask sends text).
# THINKING OFF by `reasoning_effort: none` and `enable_thinking: false`.
# Sampling: the card's: temperature 1.0 and top_p 0.95 'across all tasks',
# non-thinking by enable_thinking=False.
{
  "name": "louise-chat-granite-4.2-3b-q8",
  "backend": "vega-louise-llama-cpp",
  "context_size": 16384,
  "env": {
    "GGML_SYCL_ENABLE_DNN": "0",
    "GGML_SYCL_FA_ONEDNN": "0",
    "NEO_CACHE_DIR": "/data/louise-cache/neo-cache"
  },
  "flash_attention": "on",
  "draft_model": "",
  "function": {
    "automatic_tool_parsing_fallback": true,
    "grammar": {
      "disable": true
    }
  },
  "gpu_layers": 999,
  "known_usecases": [
    "chat"
  ],
  "mmap": true,
  "mmproj": "",
  "options": [
    "use_jinja:true",
    "parallel:1",
    "cache_ram:0",
    "ubatch:512"
  ],
  "parameters": {
    "seed": 0,
    "batch": 2048,
    "temperature": 1.0,
    "top_p": 0.95,
    "repeat_penalty": 1,
    "model": "llama-cpp/models/granite-4.2-3b/granite-4.2-3b-Q8_0.gguf"
  },
  "template": {
    "use_tokenizer_template": true
  },
  "threads": 6,
  "reasoning_effort": "none",
  "chat_template_kwargs": {
    "enable_thinking": false
  }
}
