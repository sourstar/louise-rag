# The chat model candidate B (operator, 2026-11-03: "Evaluate B now, in case
# it fits we switch it right away as chat"; "If it is available use localai to
# get the model. Do not reinvent the wheel").
# INSTALLED FROM LOCALAI'S MODEL GALLERY, entry `nemotron-3.5-bolt-e4b-q4`:
#   POST /models/apply with ../gallery/louise-chat-nemotron-bolt-e4b-q4.json
# The gallery fetches unsloth's GGUF and its vision projector, pinned by sha256.
# THE 4-BIT BUILD: variant `nemotron-3.5-bolt-e4b-q4` (the entry's own
# build), UD-Q4_K_XL, plus the same projector. Naming the entry selects its
# base (LocalAI core/gallery SelectVariant: a pin matching the entry's name).
# The 8-bit build is louise-chat-nemotron-bolt-e4b-q8; the operator has both
# evaluated ("Evaluate both 8bit and 4bit builds").
# The entry also sets the function handling (automatic_tool_parsing_fallback,
# grammar off) and the sampling (top_k 64, top_p 0.95, min_p 0.01).
# Our overrides add only the engine settings of the chat model
# (louise-chat-qwen3-8b): our llama.cpp package, the SYCL determinism env,
# parallel 1, a 16k context, seed 0, thinking off.
# This file is the q8 install's, with the q4 file; the node's replaces it
# after the install if the two differ (staged YAMLs = deployed).
{
  "backend": "vega-louise-llama-cpp",
  "context_size": 16384,
  "env": {
    "GGML_SYCL_ENABLE_DNN": "0",
    "GGML_SYCL_FA_ONEDNN": "0",
    "NEO_CACHE_DIR": "/data/louise-cache/neo-cache"
  },
  "flash_attention": "on",
  "function": {
    "automatic_tool_parsing_fallback": true,
    "grammar": {
      "disable": true
    }
  },
  "gpu_layers": 999,
  "known_usecases": ["chat", "vision"],
  "mmap": true,
  "mmproj": "llama-cpp/mmproj/nemotron-3.5-bolt-e4b/mmproj-F16.gguf",
  "name": "louise-chat-nemotron-bolt-e4b-q4",
  "options": [
    "use_jinja:true",
    "parallel:1",
    "cache_ram:0",
    "ubatch:512"
  ],
  "parameters": {
    "batch": 2048,
    "min_p": 0.01,
    "model": "llama-cpp/models/nemotron-3.5-bolt-e4b/NVIDIA-Nemotron-3.5-Bolt-E4B-UD-Q4_K_XL.gguf",
    "seed": 0,
    "temperature": 1,
    "top_k": 64,
    "top_p": 0.95
  },
  "reasoning_effort": "none",
  "template": {
    "use_tokenizer_template": true
  },
  "threads": 6
}
