# vega-medcpt-query — staged in the LocalAI app (docs/notes/vega.md §12), beside the live RAGE;
# no Louise collection uses it yet. Behind VeGa (backend vega-llama-cpp: the wrapper in front of
# intel-sycl-f16-llama-cpp), so every vector has a receipt.
# NOT pinned: pubmed's query side; pubmed embeds nothing (embed = "off").
# Every load option is RAGE's medcpt-query.yaml (/mnt/ssd5/apps/louise-rage/state/localai-models/,
# read only), the weights the same host files, mounted read-only at
# /models/weights/<name> (deploy/vega/stage/mounts.py), so the model path is
# RAGE's too. Only the backend, the env (caches under /data/louise-cache) and
# `pinned` differ. JSON, which is YAML.
{
  "name": "vega-medcpt-query",
  "backend": "vega-llama-cpp",
  "embeddings": true,
  "pinned": true,
  "context_size": 512,
  "threads": 6,
  "gpu_layers": 999,
  "flash_attention": "on",
  "mmap": true,
  "parameters": {
    "model": "weights/medcpt/MedCPT-Query-Encoder-f16.gguf",
    "batch": 512,
    "seed": 0
  },
  "options": [
    "parallel:1",
    "pooling:cls",
    "ubatch:512"
  ],
  "env": {
    "NEO_CACHE_DIR": "/data/louise-cache/neo-cache"
  }
}
