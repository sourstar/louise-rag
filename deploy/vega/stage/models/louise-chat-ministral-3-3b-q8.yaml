# A chat model candidate under 4 B (operator, 2026-11-03: "Search around for
# official chat models at about 4b and 2b"; docs/notes/nemotron-embed.md).
# Ministral 3 3B Instruct 2512 (Mistral AI): 3.8 B, Apache-2.0, 11 languages
# incl. the five, native function calling; no thinking mode.
# INSTALLED FROM LOCALAI'S MODEL GALLERY, entry `mistralai_ministral-3-3b-instruct-2512-multimodal`: POST /models/apply
#   with ../gallery/louise-chat-ministral-3-3b-q8.json.
# THE 8-BIT BUILD is added as a file (unsloth/Ministral-3-3B-Instruct-2512-GGUF); the node pins its uri
#   to the Hub's commit and writes its sha256 in at the install, as for
#   the 9B (this container's proxy refuses the Hub API).
# Ours on top: our llama.cpp package and the measured SYCL set
# (tests/vega/test_engine_settings.py), parallel 1, a 16k context, seed 0,
# no drafter, NO VISION PROJECTOR (Ask sends text).
# No thinking switch to set.
# Sampling: the card's: 'starting with a temperature of 0.1 for most use
# cases'.
{
  "name": "louise-chat-ministral-3-3b-q8",
  "backend": "vega-louise-llama-cpp",
  "context_size": 16384,
  "env": {
    "GGML_SYCL_ENABLE_DNN": "0",
    "GGML_SYCL_FA_ONEDNN": "0",
    "NEO_CACHE_DIR": "/data/louise-cache/neo-cache"
  },
  "flash_attention": "on",
  "draft_model": "",
  "function": {
    "automatic_tool_parsing_fallback": true,
    "grammar": {
      "disable": true
    }
  },
  "gpu_layers": 999,
  "known_usecases": [
    "chat"
  ],
  "mmap": true,
  "mmproj": "",
  "options": [
    "use_jinja:true",
    "parallel:1",
    "cache_ram:0",
    "ubatch:512"
  ],
  "parameters": {
    "seed": 0,
    "batch": 2048,
    "temperature": 0.1,
    "repeat_penalty": 1,
    "model": "llama-cpp/models/Ministral-3-3B-Instruct-2512-Q8_0.gguf"
  },
  "template": {
    "use_tokenizer_template": true
  },
  "threads": 6
}
