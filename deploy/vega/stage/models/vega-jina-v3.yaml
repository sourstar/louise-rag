# backend: the louise-python tree installed BESIDE its predecessor under a dated name
# (docs/notes/louise-python-rebuild.md §2.3–2.4); -20261020b is the rebuild with the jina-v3
# cache_dir fix, live 2026-10-20. A rebuild changes this line and nothing else.
# vega-jina-v3 — the wikidata collection's DOCUMENT encoder (docs/notes/wikidata-build-plan.md
# §2 "The space"): jinaai/jina-embeddings-v3 at ab036b0 with its remote code bd55a5e, the folder
# deploy/jina-embeddings-v3/fetch.py writes, on torch XPU through louise-python's `jina-v3` task
# (deploy/jina-embeddings-v3/server.py), behind VeGa. Adapter retrieval.passage, Matryoshka
# width 512 (Wikimedia's vectors), the vector normalised by the task (layout FINAL).
# context_size is the SPACE's ctx, 1,024 — the window of the TEXT, which VeGa requires as the
# model's context_size for a `cut: tokens` space (char-cut-truncation.md §4; a YAML at the model's
# 8,192 made VeGa refuse every text tagged 1,024 — München, 2026-10-20). The task adds the
# adapter's instruction ("Represent the document for retrieval: ") and the specials ON TOP of
# it in the model's own 8,192 window, so a 1,024-token chunk keeps its tail, as Wikimedia
# embedded it. NOT pinned until the collection embeds with it (then `pinned: true`, as
# vega-dar-legal-it). The weights: /mnt/ssd5/apps/models/jina-embeddings-v3, under the one
# read-only weights mount. env: NEO_CACHE_DIR as every XPU model's; LOUISE_TORCH_DETERMINISTIC
# is added ONLY if the invariant-12 measurement needs it (docs/notes/louise-python-rebuild.md §5).
# JSON, which is YAML.
{
  "name": "vega-jina-v3",
  "backend": "vega-louise-python-20261020b",
  "embeddings": true,
  "pinned": false,
  "context_size": 1024,
  "threads": 6,
  "gpu_layers": 0,
  "parameters": {
    "model": "weights/jina-embeddings-v3",
    "batch": 1,
    "seed": 0
  },
  "options": [
    "task:jina-v3",
    "device:xpu",
    "adapter:retrieval.passage",
    "dim:512"
  ],
  "env": {
    "NEO_CACHE_DIR": "/data/louise-cache/neo-cache"
  }
}
