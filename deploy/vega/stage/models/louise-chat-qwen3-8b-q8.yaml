# The chat model candidate Qwen3-8B at 8 bits (operator, 2026-11-06: "Chat model for rag
# retrieval: qwen3 8b, qwen3.5 9b and command r7b are the only candidates ... start with
# the Q8 quantization"). The live file (louise-chat-qwen3-8b.yaml) is Q4_K_M, the copy of
# Ollama's qwen3:8b; this one differs from it in the weights and the stated sampling only.
# INSTALLED FROM LOCALAI'S MODEL GALLERY, entry `qwen3-8b`: POST /models/apply with
#   ../gallery/louise-chat-qwen3-8b-q8.json, Qwen's own Q8_0 (Qwen/Qwen3-8B-GGUF, 8.71 GB)
#   added as a file; the node pins its uri to the Hub's commit and writes its sha256 in at
#   the install, as for the 9B (this container's proxy refuses the Hub API).
# Ours on top, as the live file: our llama.cpp package and the measured SYCL set
# (tests/vega/test_engine_settings.py), parallel 1, a 16k context, seed 0; THINKING OFF by
# `reasoning_effort: none` and `enable_thinking: false`. Sampling: the card's for
# non-thinking mode (temperature 0.7, top_p 0.8, top_k 20, min_p 0).
# SAMPLING, EVERY VALUE STATED (2026-11-06, docs/notes/nemotron-embed.md "Sampling, Q8
# first"): an unset value gets LocalAI's generic default (temperature 0.9, top_p 0.95,
# top_k 40), not the card's; the penalties are NEUTRAL here because a request cannot set
# one back to 0 (LocalAI reads 0 as unset): the chat benchmark's arms send the penalty
# they test; `repeat_last_n` 64 (llama.cpp's default) because LocalAI sends 0 when the
# file names none, and 0 DISABLES every penalty in llama.cpp.
{
  "name": "louise-chat-qwen3-8b-q8",
  "backend": "vega-louise-llama-cpp",
  "context_size": 16384,
  "env": {
    "GGML_SYCL_ENABLE_DNN": "0",
    "GGML_SYCL_FA_ONEDNN": "0",
    "NEO_CACHE_DIR": "/data/louise-cache/neo-cache"
  },
  "flash_attention": "on",
  "draft_model": "",
  "gpu_layers": 999,
  "known_usecases": [
    "chat"
  ],
  "mmap": true,
  "mmproj": "",
  "options": [
    "parallel:1",
    "cache_ram:0",
    "ubatch:512",
    "use_jinja:true"
  ],
  "parameters": {
    "model": "llama-cpp/models/Qwen3-8B-Q8_0.gguf",
    "batch": 2048,
    "seed": 0,
    "temperature": 0.7,
    "top_p": 0.8,
    "top_k": 20,
    "min_p": 0,
    "presence_penalty": 0,
    "frequency_penalty": 0,
    "repeat_penalty": 1,
    "repeat_last_n": 64
  },
  "reasoning_effort": "none",
  "chat_template_kwargs": {
    "enable_thinking": false
  },
  "template": {
    "use_tokenizer_template": true
  },
  "threads": 6
}
