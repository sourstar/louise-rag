# Qwen3-8B at 4 bits (operator, 2026-11-06: "when you find the optimal one you lower the
# quantization to observe the performance decrease"). The optimal one: Qwen3-8B Q8 at 0.7 (the
# card). Qwen's own Q4_K_M (Qwen/Qwen3-8B-GGUF, 5.03 GB), as the Q8 is Qwen's own Q8_0: the
# quantization is the one difference. INSTALLED FROM LOCALAI'S GALLERY, entry `qwen3-8b`, the
# file pinned to the Hub's commit and its sha256 at the install. The live file is Ollama's
# qwen3:8b Q4_K_M copy; this one is Qwen's, named.
# SAMPLING, EVERY VALUE STATED (2026-11-06): the Q8 file's, the card's non-thinking values; neutral
# penalties, repeat_last_n 64 (docs/notes/nemotron-embed.md "Sampling, Q8 first").
{
  "name": "louise-chat-qwen3-8b-q4",
  "backend": "vega-louise-llama-cpp",
  "context_size": 16384,
  "env": {
    "GGML_SYCL_ENABLE_DNN": "0",
    "GGML_SYCL_FA_ONEDNN": "0",
    "NEO_CACHE_DIR": "/data/louise-cache/neo-cache"
  },
  "flash_attention": "on",
  "draft_model": "",
  "gpu_layers": 999,
  "known_usecases": [
    "chat"
  ],
  "mmap": true,
  "mmproj": "",
  "options": [
    "parallel:1",
    "cache_ram:0",
    "ubatch:512",
    "use_jinja:true"
  ],
  "parameters": {
    "model": "llama-cpp/models/Qwen3-8B-Q4_K_M.gguf",
    "batch": 2048,
    "seed": 0,
    "temperature": 0.7,
    "top_p": 0.8,
    "top_k": 20,
    "min_p": 0,
    "presence_penalty": 0,
    "frequency_penalty": 0,
    "repeat_penalty": 1,
    "repeat_last_n": 64
  },
  "reasoning_effort": "none",
  "chat_template_kwargs": {
    "enable_thinking": false
  },
  "template": {
    "use_tokenizer_template": true
  },
  "threads": 6
}
