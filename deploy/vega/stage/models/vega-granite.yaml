# vega-granite — staged in the LocalAI app (docs/notes/vega.md §12), beside the live the model pool;
# no Louise collection uses it yet. Behind VeGa (backend vega-llama-cpp: the wrapper in front of
# intel-sycl-f16-llama-cpp), so every vector has a receipt.
# PINNED (vega.md §11): deposit-granite embeds with it (embed = "all") and it is
# the node's default encoder (platform.toml); 211 MiB of weights.
# Every load option is the model pool's granite-embedding-107m-multilingual.yaml (/mnt/ssd5/apps/louise-rage/state/localai-models/,
# read only), the weights the same host files, mounted read-only at
# /models/weights/<name> (deploy/vega/stage/mounts.py), so the model path is
# the model pool's too. Only the backend, the env (caches under /data/louise-cache) and
# `pinned` differ. JSON, which is YAML.
{
  "name": "vega-granite",
  "backend": "vega-llama-cpp",
  "embeddings": true,
  "pinned": false,
  "context_size": 512,
  "threads": 6,
  "gpu_layers": 999,
  "flash_attention": "on",
  "mmap": true,
  "parameters": {
    "model": "weights/granite/granite-embedding-107m-multilingual-f16.gguf",
    "batch": 512,
    "seed": 0
  },
  "options": [
    "parallel:1",
    "pooling:cls",
    "ubatch:512"
  ],
  "env": {
    "NEO_CACHE_DIR": "/data/louise-cache/neo-cache",
    "GGML_SYCL_ENABLE_DNN": "0",
    "GGML_SYCL_FA_ONEDNN": "0"
  }
}
