# Qwen3.8-9B (Empero AI: a full-parameter distillation of Qwen3.8 2.4T A95B into the dense Qwen3.5-9B
# architecture; ~70k teacher traces, card language tag `en` only, trained to open every answer with a
# <think> block). INSTALLED BY THE OPERATOR from LocalAI's gallery, entry `qwen3.8-9b-q4`, which LocalAI
# resolved to its Q8_0 variant on this card (empero-ai/Qwen3.8-9B-GGUF, Qwen3.8-9B-Q8_0.gguf,
# 9,786,060,096 bytes; 2026-11-03 10:45Z). The operator's own YAML (qwen3.8-9b-q4.yaml: upstream
# `llama-cpp`, 262,144 context) is left as installed; THIS entry runs the same file on ours: our llama.cpp
# package and the SYCL exact mode (the measured set, tests/vega/test_engine_settings.py), parallel 1, a 16k
# context, seed 0; THINKING OFF by `reasoning_effort: none` and `chat_template_kwargs.enable_thinking:
# false` (whether a distill trained to always think obeys is the engine check's question); the entry's
# sampling (temperature 0.6, top_p 0.95, top_k 20, min_p 0); no vision projector. A chat candidate for the
# Ask benchmark (nemotron-embed.md, the chat model), with Qwen3-8B, Bolt-E4B and Qwen3.5-9B.
{
  "backend": "vega-louise-llama-cpp",
  "context_size": 16384,
  "env": {
    "GGML_SYCL_ENABLE_DNN": "0",
    "GGML_SYCL_FA_ONEDNN": "0",
    "NEO_CACHE_DIR": "/data/louise-cache/neo-cache"
  },
  "flash_attention": "on",
  "function": {
    "automatic_tool_parsing_fallback": true,
    "grammar": {
      "disable": true
    }
  },
  "gpu_layers": 999,
  "known_usecases": [
    "chat"
  ],
  "mmap": true,
  "name": "louise-chat-qwen3.8-9b-q8",
  "options": [
    "use_jinja:true",
    "parallel:1",
    "cache_ram:0",
    "ubatch:512"
  ],
  "parameters": {
    "batch": 2048,
    "model": "llama-cpp/models/qwen3.8-9b/Qwen3.8-9B-Q8_0.gguf",
    "seed": 0,
    "temperature": 0.6,
    "top_p": 0.95,
    "top_k": 20,
    "min_p": 0,
    "presence_penalty": 0,
    "repeat_penalty": 1
  },
  "reasoning_effort": "none",
  "chat_template_kwargs": {
    "enable_thinking": false
  },
  "template": {
    "use_tokenizer_template": true
  },
  "threads": 6
}
