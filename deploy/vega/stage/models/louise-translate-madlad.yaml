# louise-translate-madlad — MADLAD-400-3B-MT on our llama.cpp backend (series
# base ec92740 + P1..P5: the encoder runs, P3; slots encoded in waves, P4; the
# SYCL batched matmul reads the permuted queries right, P5; engine c68167b65cb0),
# live since 2026-10-28 under the name TRANSLATE_MODEL has always had, so no
# app setting moved: app/translate.py determines the shape from the server
# (the t5 shape: one raw "<2xx> segment" completion per segment, greedy; a
# question's languages sent at once decode in one wave). Its own backend,
# `vega-llama-cpp-t5`: the shared embedder backend was not rebuilt
# for it, so no embedder became a new engine (invariant 12). A wave is at most
# one ubatch (1024) of encoder tokens — seven 96-token segments fit; the KV
# pool (context_size) holds 7 slots x up to 512 decoder positions.
# The torch model it replaced is kept as louise-translate-madlad-torch (backout).
# The KV cache is llama.cpp's default F16. The first build (series f8b4acdcdcb8) ran
# it f32 to sidestep wrong text whenever two or more slots decoded in one batch; the
# cause was ggml-sycl's own src1 conversion on the oneMKL path, fixed by P5
# (localai-bugs.md P5), and the F16 cache is gated on engine c68167b65cb0: 379/379 =
# P3's bytes, in-wave == alone 616/626, retrieval paired-equal to torch, 16.3 ms per
# token (f32: 29.2), 0.68 s per question in waves (f32: 1.12; torch 3.2).
# 2026-11-0x (operator's A, 2026-11-02: one llama.cpp engine for every model): the
# series moved to LocalAI 16acc89 / llama.cpp ddf48f8 (tag 089b1da509fe, P3/P4
# rebased, localai-bugs.md), and MADLAD left its own tar install for the one
# engine, louise-sycl-f16-llama-cpp-16acc89, loaded directly as before: VeGa's
# wrapper refuses a llama.cpp load without parallel:1 (determinism_lacks), and
# MADLAD decodes 7 slots in waves. The gates above are re-run on it (t5waves
# T4/T3/in-wave), the old engine's bytes the reference.
# JSON, which is YAML.
{
  "name": "louise-translate-madlad",
  "backend": "louise-sycl-f16-llama-cpp-16acc89",
  "context_size": 4096,
  "env": {
    "GGML_SYCL_ENABLE_DNN": "0",
    "GGML_SYCL_FA_ONEDNN": "0",
    "NEO_CACHE_DIR": "/data/louise-cache/neo-cache"
  },
  "flash_attention": "off",
  "gpu_layers": 999,
  "mmap": true,
  "threads": 6,
  "known_usecases": ["completion"],
  "options": [
    "parallel:7",
    "cache_ram:0",
    "ubatch:1024"
  ],
  "parameters": {
    "batch": 1024,
    "model": "weights/madlad/madlad400-3b-mt-f16.gguf",
    "temperature": 0,
    "top_k": 1,
    "seed": 0
  },
  "template": {
    "completion": "{{.Input}}"
  }
}
