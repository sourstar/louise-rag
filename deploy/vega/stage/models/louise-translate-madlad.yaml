# backend: the louise-python tree installed BESIDE its predecessor under a dated name
# (docs/notes/louise-python-rebuild.md §2.3–2.4); -20261020c is the rebuild with the jina-v3
# window fix (context_size 1024, the instruction on top), live 2026-10-20 08:51Z. A rebuild changes this line and nothing else.
# louise-translate-madlad — staged in the LocalAI app (docs/notes/vega.md §12),
# beside the live RAGE; no Louise collection uses it yet. MADLAD-400-3B-MT on torch
# XPU, `Predict`: the batch as one JSON prompt (app/translate.py, the completion
# shape), so NO template and none of echo, cutstrings, extract_regex, trimspace
# or trimsuffix. Backend louise-madlad (its own torch 2.14.0+xpu; built for this app
# by deploy/vega/stage/build_louise_backend.sh). Every load option is RAGE's
# madlad.yaml; the weights the same host files, mounted read-only.
# JSON, which is YAML.
{
  "name": "louise-translate-madlad",
  "backend": "louise-python-20261020c",
  "context_size": 512,
  "threads": 6,
  "gpu_layers": 0,
  "parameters": {
    "model": "weights/madlad/madlad400-3b-mt-bf16",
    "batch": 32,
    "seed": 0
  },
  "options": [
    "task:madlad",
    "device:xpu",
    "dtype:bfloat16",
    "max_seg_tokens:96",
    "beams:1",
    "max_items:512"
  ],
  "env": {
    "NEO_CACHE_DIR": "/data/louise-cache/neo-cache"
  }
}
