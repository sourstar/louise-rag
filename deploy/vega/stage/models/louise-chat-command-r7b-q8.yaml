# Command R7B (Cohere, 2024-12): 8.0 B, trained for answers grounded in given
# documents with citations, and for tools; 23 languages incl. en it de fr es.
# LICENCE CC-BY-NC 4.0, NON-COMMERCIAL USE ONLY, with Cohere's acceptable-use
#   policy: ACCEPTED BY THE OPERATOR for this node, 2026-11-03 ("choice A":
#   run it on the recorded searches). Never a default Louise recommends to
#   another peer.
# NOT IN LOCALAI'S GALLERY: installed with ../gallery/louise-chat-command-r7b-q8.json, LocalAI's
#   virtual base and bartowski's Q8_0 (imatrix quantization of
#   CohereForAI/c4ai-command-r7b-12-2024, llama.cpp b4415) added as a file; the
#   node pins its uri to the Hub's commit and writes its sha256 in at the
#   install, as for the 9B Q8.
# Ours on top: our llama.cpp package and the measured SYCL set, parallel 1, a
# 16k context, seed 0. No thinking mode to switch off. Sampling: Cohere's
# chat API defaults (temperature 0.3, p 0.75, k 0 = off); the original card
# is gated and was not read.
# STOPWORDS <|END_OF_TURN_TOKEN|> (measured 2026-11-03): on our engine (llama.cpp
#   ddf48f8, no dedicated Command-R parser) an answer asked WITHOUT tools ends
#   with the end-of-turn marker as text; the stop word removes it (same request,
#   finish_reason stop either way). With tools, R7B's tool calls are not placed
#   by the auto-parser (HTTP 500): Ask answers that round without tools (#303).
# SAMPLING, EVERY VALUE STATED (2026-11-06, docs/notes/nemotron-embed.md "Sampling, Q8
# first"): an unset value gets LocalAI's generic default (temperature 0.9, top_p 0.95,
# top_k 40), not the card's; the penalties are NEUTRAL here because a request cannot set
# one back to 0 (LocalAI reads 0 as unset): the chat benchmark's arms send the penalty
# they test; `repeat_last_n` 64 (llama.cpp's default) because LocalAI sends 0 when the
# file names none, and 0 DISABLES every penalty in llama.cpp.
{
  "name": "louise-chat-command-r7b-q8",
  "backend": "vega-louise-llama-cpp",
  "context_size": 16384,
  "env": {
    "GGML_SYCL_ENABLE_DNN": "0",
    "GGML_SYCL_FA_ONEDNN": "0",
    "NEO_CACHE_DIR": "/data/louise-cache/neo-cache"
  },
  "flash_attention": "on",
  "draft_model": "",
  "function": {
    "automatic_tool_parsing_fallback": true,
    "grammar": {
      "disable": true
    }
  },
  "gpu_layers": 999,
  "known_usecases": [
    "chat"
  ],
  "mmap": true,
  "mmproj": "",
  "options": [
    "use_jinja:true",
    "parallel:1",
    "cache_ram:0",
    "ubatch:512"
  ],
  "parameters": {
    "model": "llama-cpp/models/c4ai-command-r7b-12-2024-Q8_0.gguf",
    "batch": 2048,
    "seed": 0,
    "temperature": 0.3,
    "top_p": 0.75,
    "top_k": 0,
    "min_p": 0,
    "presence_penalty": 0,
    "frequency_penalty": 0,
    "repeat_penalty": 1,
    "repeat_last_n": 64
  },
  "stopwords": [
    "<|END_OF_TURN_TOKEN|>"
  ],
  "template": {
    "use_tokenizer_template": true
  },
  "threads": 6
}
