# Qwen3-8B Q8 with the KV cache at 8 bits (operator, 2026-11-06: "Go for the first": F16 for the
# sampling sweep, then one Q8_0 arm on the winner). The winner: Qwen3-8B Q8 at 0.7 (the card),
# blind head-to-head of 2026-11-06. THE SAME FILE AS louise-chat-qwen3-8b-q8 but for
# cache_type_k/v q8_0 (LocalAI's LLMConfig keys): the same weights, no download. Measured for
# answers (blind read), speed and memory on an unloaded node; its probe must pass first.
# SAMPLING, EVERY VALUE STATED (2026-11-06): the Q8 file's, the card's non-thinking values; neutral
# penalties, repeat_last_n 64 (docs/notes/nemotron-embed.md "Sampling, Q8 first").
{
  "name": "louise-chat-qwen3-8b-q8-kvq8",
  "backend": "vega-louise-llama-cpp",
  "context_size": 16384,
  "env": {
    "GGML_SYCL_ENABLE_DNN": "0",
    "GGML_SYCL_FA_ONEDNN": "0",
    "NEO_CACHE_DIR": "/data/louise-cache/neo-cache"
  },
  "flash_attention": "on",
  "draft_model": "",
  "gpu_layers": 999,
  "known_usecases": [
    "chat"
  ],
  "mmap": true,
  "mmproj": "",
  "options": [
    "parallel:1",
    "cache_ram:0",
    "ubatch:512",
    "use_jinja:true"
  ],
  "parameters": {
    "model": "llama-cpp/models/Qwen3-8B-Q8_0.gguf",
    "batch": 2048,
    "seed": 0,
    "temperature": 0.7,
    "top_p": 0.8,
    "top_k": 20,
    "min_p": 0,
    "presence_penalty": 0,
    "frequency_penalty": 0,
    "repeat_penalty": 1,
    "repeat_last_n": 64
  },
  "reasoning_effort": "none",
  "chat_template_kwargs": {
    "enable_thinking": false
  },
  "template": {
    "use_tokenizer_template": true
  },
  "threads": 6,
  "cache_type_k": "q8_0",
  "cache_type_v": "q8_0"
}
