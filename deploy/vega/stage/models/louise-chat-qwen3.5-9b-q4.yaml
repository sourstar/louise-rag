# The chat model candidate Qwen3.5-9B (operator, 2026-11-03: "Evaluate also
# Qwen3.5-9B"). Its card: 9.65 B parameters, Apache-2.0, 201 languages, a hybrid
# of Gated DeltaNet and gated attention (8 x (3 DeltaNet + 1 attention) layers),
# thinking BY DEFAULT and no /no_think switch (Qwen3's soft switch is gone).
# INSTALLED FROM LOCALAI'S MODEL GALLERY, entry `qwen3.5-9b` (unsloth's GGUF,
#   sha256-pinned): POST /models/apply with ../gallery/louise-chat-qwen3.5-9b-q4.json, the entry
#   named as `variant` so its own build is taken, never a guess.
# THE 4-BIT BUILD is the entry's own: Q4_K_M, sha256 03b74727…7e8. On the node it came with the operator's
# install of the gallery's qwen3.5-9b-dflash variant (2026-11-03), stored under llama-cpp/models/Qwen3.5-9B-GGUF/.
# Ours on top: our llama.cpp package and the SYCL exact mode (the measured
# set, tests/vega/test_engine_settings.py), parallel 1, a 16k context, seed 0;
# THINKING OFF by `reasoning_effort: none` (LocalAI maps it to the template's
# enable_thinking) and `chat_template_kwargs.enable_thinking: false` stated
# too; the card's sampling for instruct mode, general tasks (temperature 0.7,
# top_p 0.8, top_k 20, min_p 0, presence_penalty 1.5). NO VISION PROJECTOR
# (`mmproj` empty): Ask sends text, and the entry's projector is F32, 1.8 GB
# on a card that is already full.
{
  "backend": "vega-louise-llama-cpp",
  "context_size": 16384,
  "env": {
    "GGML_SYCL_ENABLE_DNN": "0",
    "GGML_SYCL_FA_ONEDNN": "0",
    "NEO_CACHE_DIR": "/data/louise-cache/neo-cache"
  },
  "flash_attention": "on",
  "function": {
    "grammar": {
      "disable": true
    }
  },
  "gpu_layers": 999,
  "known_usecases": [
    "chat"
  ],
  "mmap": true,
  "name": "louise-chat-qwen3.5-9b-q4",
  "options": [
    "use_jinja:true",
    "parallel:1",
    "cache_ram:0",
    "ubatch:512"
  ],
  "parameters": {
    "batch": 2048,
    "model": "llama-cpp/models/Qwen3.5-9B-GGUF/Qwen3.5-9B-Q4_K_M.gguf",
    "seed": 0,
    "temperature": 0.7,
    "top_p": 0.8,
    "top_k": 20,
    "min_p": 0,
    "presence_penalty": 1.5,
    "repeat_penalty": 1
  },
  "reasoning_effort": "none",
  "chat_template_kwargs": {
    "enable_thinking": false
  },
  "template": {
    "use_tokenizer_template": true
  },
  "threads": 6
}
