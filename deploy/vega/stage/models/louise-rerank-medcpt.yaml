# backend: the louise-python tree installed BESIDE its predecessor under a dated name
# (docs/notes/louise-python-rebuild.md §2.3–2.4); -20261020c is the rebuild with the jina-v3
# window fix (context_size 1024, the instruction on top), live 2026-10-20 08:51Z. A rebuild changes this line and nothing else.
# louise-rerank-medcpt — staged in the LocalAI app (docs/notes/vega.md §12), beside
# the live RAGE; no Louise collection uses it yet. MedCPT's cross-encoder on
# OpenVINO, `Rerank` at /v1/rerank (Jina's shape), an ordinary model (no VeGa).
# Backend louise-medcpt-rerank (deploy/localai/backends, built for this app by
# deploy/vega/stage/build_louise_backend.sh). Every load option is RAGE's
# medcpt-rerank.yaml; the weights the same host files, mounted read-only.
# JSON, which is YAML.
{
  "name": "louise-rerank-medcpt",
  "backend": "louise-python-20261020c",
  "reranking": true,
  "context_size": 512,
  "threads": 6,
  "gpu_layers": 0,
  "parameters": {
    "model": "weights/medcpt/medcpt-cross-ov",
    "batch": 16,
    "seed": 0
  },
  "options": [
    "task:medcpt-rerank",
    "device:xpu"
  ],
  "env": {
    "NEO_CACHE_DIR": "/data/louise-cache/neo-cache",
    "OV_CACHE_DIR": "/data/louise-cache/ov-cache"
  },
  "pinned": true
}
