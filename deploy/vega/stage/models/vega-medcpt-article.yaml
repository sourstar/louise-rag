# vega-medcpt-article — staged in the LocalAI app (docs/notes/vega.md §12), beside the live the model pool;
# no Louise collection uses it yet. Behind VeGa (backend vega-llama-cpp: the wrapper in front of
# intel-sycl-f16-llama-cpp), so every vector has a receipt.
# The GGUF article encoder of pubmed's CURRENT space (text input). The pair
# encoder of input-forms.md is vega-medcpt-article-ov. NOT pinned: pubmed
# embeds nothing (embed = "off").
# Every load option is the model pool's medcpt-article.yaml (the model pool's state/localai-models/,
# read only), the weights the same host files, mounted read-only at
# /models/weights/<name> (deploy/vega/stage/mounts.py), so the model path is
# the model pool's too. Only the backend, the env (caches under /data/louise-cache) and
# `pinned` differ. JSON, which is YAML.
{
  "name": "vega-medcpt-article",
  "backend": "vega-llama-cpp",
  "embeddings": true,
  "pinned": false,
  "context_size": 512,
  "threads": 6,
  "gpu_layers": 999,
  "flash_attention": "on",
  "mmap": true,
  "parameters": {
    "model": "weights/medcpt/MedCPT-Article-Encoder-f16.gguf",
    "batch": 512,
    "seed": 0
  },
  "options": [
    "parallel:1",
    "pooling:cls",
    "ubatch:512"
  ],
  "env": {
    "NEO_CACHE_DIR": "/data/louise-cache/neo-cache",
    "GGML_SYCL_ENABLE_DNN": "0",
    "GGML_SYCL_FA_ONEDNN": "0"
  }
}
