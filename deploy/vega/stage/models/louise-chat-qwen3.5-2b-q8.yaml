# A chat model candidate under 4 B (operator, 2026-11-03: "Search around for
# official chat models at about 4b and 2b"; docs/notes/nemotron-embed.md).
# Qwen3.5-2B (Alibaba): 2.3 B, Apache-2.0, 201 languages, tools.
# INSTALLED FROM LOCALAI'S MODEL GALLERY, entry `qwen_qwen3.5-2b`: POST /models/apply
#   with ../gallery/louise-chat-qwen3.5-2b-q8.json.
# THE 8-BIT BUILD is added as a file (bartowski/Qwen_Qwen3.5-2B-GGUF); the node pins its uri
#   to the Hub's commit and writes its sha256 in at the install, as for
#   the 9B (this container's proxy refuses the Hub API).
# Ours on top: our llama.cpp package and the measured SYCL set
# (tests/vega/test_engine_settings.py), parallel 1, a 16k context, seed 0,
# no drafter, NO VISION PROJECTOR (Ask sends text).
# THINKING OFF by `reasoning_effort: none` and `enable_thinking: false`.
# Sampling: the card's instruct-mode sampling, general tasks, as for the 9B.
{
  "name": "louise-chat-qwen3.5-2b-q8",
  "backend": "vega-louise-llama-cpp",
  "context_size": 16384,
  "env": {
    "GGML_SYCL_ENABLE_DNN": "0",
    "GGML_SYCL_FA_ONEDNN": "0",
    "NEO_CACHE_DIR": "/data/louise-cache/neo-cache"
  },
  "flash_attention": "on",
  "draft_model": "",
  "function": {
    "automatic_tool_parsing_fallback": true,
    "grammar": {
      "disable": true
    }
  },
  "gpu_layers": 999,
  "known_usecases": [
    "chat"
  ],
  "mmap": true,
  "mmproj": "",
  "options": [
    "use_jinja:true",
    "parallel:1",
    "cache_ram:0",
    "ubatch:512"
  ],
  "parameters": {
    "seed": 0,
    "batch": 2048,
    "temperature": 0.7,
    "top_p": 0.8,
    "top_k": 20,
    "min_p": 0,
    "presence_penalty": 1.5,
    "repeat_penalty": 1,
    "model": "llama-cpp/models/Qwen_Qwen3.5-2B-Q8_0.gguf"
  },
  "template": {
    "use_tokenizer_template": true
  },
  "threads": 6,
  "reasoning_effort": "none",
  "chat_template_kwargs": {
    "enable_thinking": false
  }
}
