# MedCPT encoders — TrueNAS SCALE custom app (Install via YAML; installed
# on the reference NAS under the app name "medcpt-embed")
#
# Serves NCBI's MedCPT bi-encoder pair (768-dim, open weights, the space of
# NCBI's published PubMed embeddings) via HuggingFace text-embeddings-
# inference on CPU. ~110M-parameter BERTs: CPU is plenty, and it never
# competes with the Qwen3 GPU embedder.
#
#   article encoder (documents)  -> :30440   ncbi/MedCPT-Article-Encoder
#   query encoder   (searches)   -> :30441   ncbi/MedCPT-Query-Encoder
#
# Both serve OpenAI-compatible /v1/embeddings; MedCPT pools on [CLS], hence
# --pooling cls. Models download from the HF Hub on first start into the
# mapped cache (create the dataset first: /mnt/ssd4/apps/medcpt-models).
#
# AFTER INSTALL — wiring the pubmed collection into the MedCPT space:
#
#   1. The pubmed collection currently sits in the node-default (Qwen3)
#      space with ZERO vectors. Switching recipes is a space change, and the
#      pin will refuse it unless the pin resets with the (empty) vector
#      table. App stopped, wipe the collection's derived data:
#          rm -rf /mnt/ssd4/apps/louise-rag/data/pubmed
#      (manifest/fts rebuild from the corpus in minutes; no vectors exist.)
#
#   2. Add to /mnt/ssd4/apps/louise-rag/config/collections/pubmed.toml:
#          [embed]
#          url = "http://192.168.178.10:30440"
#          api = "openai"
#          model = "ncbi/MedCPT-Article-Encoder"
#          dtype = "f16"
#          ctx = 512
#          dim = 768
#          query_url = "http://192.168.178.10:30441"
#
#   3. Start louise-rag; after discovery + fts, run the genesis import —
#      NCBI's precomputed vectors for every PMID this node holds:
#          docker exec ix-louise-rag-worker-1 \
#            python -m app.cli genesis import pubmed --archive medcpt-pubmed
#      (resumable shard by shard; ~100 GB source but only held PMIDs land.
#      The importer proves archive==local-encoder on a sample before a
#      single row is written, then the worker gap-fills anything the
#      archive lacks through the same endpoint.)

services:
  medcpt-article:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    command: --model-id ncbi/MedCPT-Article-Encoder --pooling cls --port 8080
    restart: unless-stopped
    ports:
      - '30440:8080'
    volumes:
      - /mnt/ssd4/apps/medcpt-models:/data

  medcpt-query:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    command: --model-id ncbi/MedCPT-Query-Encoder --pooling cls --port 8080
    restart: unless-stopped
    ports:
      - '30441:8080'
    volumes:
      - /mnt/ssd4/apps/medcpt-models:/data
