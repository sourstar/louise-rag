# The node's YAML (/mnt/ssd5/apps/localai/models), byte for byte in every
# load option, without NEO_CACHE_DIR (Intel's compiler cache) and with the
# AMD deterministic mode in env (CLAUDE.md invariant 12). A different
# CPU TWIN (tools/cross_device_check.py): the same build with no card at all —
# no layers, no op offload, and HIP shown no device.
name: vega-qwen3-embedding-4b-cpu
backend: vega-llama-cpp
embeddings: true
pinned: false
context_size: 8192
# every logical CPU of the Perugia PC (Ryzen 7 9700X, SMT on since 2026-10-25);
# embedding runs on llama.cpp's BATCH threads, which default to the physical
# core count (8) whatever `threads` says — hence threads_batch below too
threads: 16
gpu_layers: 0
flash_attention: "on"
mmap: true
parameters:
    model: weights/llama-embed/Qwen3-Embedding-4B-Q4_K_M.gguf
    batch: 8192
    seed: 0
options:
    - parallel:1
    - pooling:last
    - ubatch:8192
    - no_op_offload:true
    - threads_batch:16
env:
    # CLAUDE.md invariant 12: rocBLAS without atomics, bit-identical run to run
    ROCBLAS_DEFAULT_ATOMICS_MODE: "0"
    HIP_VISIBLE_DEVICES: "-1"
