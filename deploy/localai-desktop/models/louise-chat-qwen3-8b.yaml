# The node's YAML (/mnt/ssd5/apps/localai/models), byte for byte in every
# load option, without NEO_CACHE_DIR (Intel's compiler cache) and with the
# AMD deterministic mode in env (CLAUDE.md invariant 12). A different
# card is a new engine and run: the space's calibration gate passes it once.
name: louise-chat-qwen3-8b
backend: rocm-llama-cpp
context_size: 16384
flash_attention: "on"
gpu_layers: 999
mmap: true
options:
    - parallel:1
    - ubatch:512
    - use_jinja:true
parameters:
    batch: 2048
    model: weights/chat/qwen3-8b.gguf
    repeat_penalty: 1
    seed: 0
    top_k: 20
    top_p: 0.95
reasoning_effort: none
template:
    use_tokenizer_template: true
threads: 6
env:
    # CLAUDE.md invariant 12: rocBLAS without atomics, bit-identical run to run
    ROCBLAS_DEFAULT_ATOMICS_MODE: "0"
