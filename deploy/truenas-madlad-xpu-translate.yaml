# MADLAD-400-3B-MT translation server on the Intel Arc — TrueNAS SCALE
# custom app "translate-gpu-madlad" (Install via YAML), named like the
# node's other model apps: <role>-<device>-<model> (embed-gpu-bge-m3, …).
#
# The node's translation model (app/translate.py, TRANSLATE_URL): a search's
# query into every language, the Ask page's titles, entries and answer.
# Measured on the node, 2026-09-18: the question into 19 main languages in
# 0.8–1.8 s (the chat model: 56–192 s with the GPU busy), one whole 3.8 kB
# entry in 5.9 s (58–84 s), at 8 GB of VRAM at peak.
#
# Before installing:
#   1. the image, built on the node from deploy/madlad-translate:
#        docker build -t madlad-translate:xpu deploy/madlad-translate
#   2. the weights, once, into the model directory (11.8 GB fp32, loaded bf16):
#        D=/mnt/ssd5/apps/madlad-models/madlad400-3b-mt; mkdir -p $D; cd $D
#        for f in config.json generation_config.json special_tokens_map.json \
#          tokenizer_config.json added_tokens.json tokenizer.json spiece.model \
#          model.safetensors; do
#          curl -fsSL -o $f https://huggingface.co/google/madlad400-3b-mt/resolve/main/$f
#        done
#   3. then TRANSLATE_URL=http://<nas>:30448 on the louise-rag app.
#
# Ollama cannot run it (it serves decoder-only models, and a MADLAD GGUF
# loads, then hangs), and llama-server runs no encoder for it (the output is
# `<2cs><2cs>…`): measured on the node, 2026-09-18.

services:
  madlad-translate:
    image: madlad-translate:xpu
    pull_policy: never
    devices:
      - /dev/dri
    environment:
      MODEL_ID: /data/madlad400-3b-mt
      HF_HUB_OFFLINE: '1'
      BATCH: '32'            # 8 GB at peak; the card is shared (server.py)
      MAX_SEG_TOKENS: '96'
    healthcheck:
      test:
        - CMD
        - python3
        - '-c'
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    ports:
      - '30448:8080'
    restart: unless-stopped
    volumes:
      - /mnt/ssd5/apps/madlad-models:/data
