# The consumer's copy of config/collections/gutenberg.toml, and one line more:
# it computes no vector, so every vector it holds arrived in a bundle. Its
# embed mode is desired state, so it lives here, in the file. Set in the
# manifest (Tier 3), the worker put the file's default back at its start
# (invariant 10). The consumer then embedded the three documents itself,
# before the bundle came, and the driver found "local" where the producer
# should be.
plugin = "gutenberg"
corpus_dir = "/corpus"
embed_mode = "off"

[embed]
url = "http://mock-embed:11434"
api = "ollama"
model = "mock-model"
dtype = "f32"
ctx = 8192
