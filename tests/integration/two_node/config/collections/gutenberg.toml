# The two-node harness's one collection. It names its encoder (the mock)
# because a collection that names none is refused: there is no default
# encoder (operator, 2026-09-18).
plugin = "gutenberg"
corpus_dir = "/corpus"

[embed]
url = "http://mock-embed:11434"
api = "ollama"
model = "mock-model"
dtype = "f32"
ctx = 8192
