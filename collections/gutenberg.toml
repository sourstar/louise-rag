# Default Gutenberg collection. Empty path fields mean "use the legacy
# top-level DATA_DIR layout" (app/config.py) — this file exists so `git clone`
# reproduces the same behavior as the code-level default in app/collections.py,
# not to change anything about an existing deployment.
name = "gutenberg"
plugin = "gutenberg"
profile = "full"
embed_mode = "lazy"

[paths]
manifest = ""
fts = ""
lancedb = ""
